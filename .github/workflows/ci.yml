name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    uses: evolution-gaming/scala-github-actions/.github/workflows/ci.yml@2a389d2a5f4b093e72f738464bd7472bd0c3b4b8 # v6
    with:
      scala_versions: '["2.13.18", "3.3.7"]'

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: coursier/cache-action@v6

    - name: setup Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'oracle'
        cache: 'sbt'

    - name: setup SBT
      uses: sbt/setup-sbt@v1

    - name: generate docs
      run: sbt docs/mdoc

    - name: setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'yarn'
        cache-dependency-path: website/yarn.lock

    - name: install dependencies
      working-directory: ./website
      run: yarn install --frozen-lockfile

    - name: build site
      working-directory: ./website
      run: yarn build

    - name: deploy
      if: github.ref == 'refs/heads/master' && github.repository == 'evolution-gaming/kafka-flow'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./website/build

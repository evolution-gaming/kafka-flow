name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # can delete tag on failed release attempt

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Clear SBT compiler bridge cache # Gets corrupted often in GH actions
        run: rm -rf ~/.sbt/boot/scala-*/org.scala-sbt/sbt/*/org.scala-sbt-compiler-bridge*
  release:
    uses: evolution-gaming/scala-github-actions/.github/workflows/release.yml@144b8762ece97a25b24621f9d470542fa1e068b4 # v7.2.0
    secrets: inherit
